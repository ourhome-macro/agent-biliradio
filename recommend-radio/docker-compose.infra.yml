name: radio-kafka

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Initialize private.env first}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-radio_acceptance}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_bin", "--max-connections=150"]
    volumes: ["mysql-data:/var/lib/mysql"]
    ports: ["127.0.0.1:${MYSQL_DOCKER_PORT:-13307}:3306"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -uroot -Nse 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 25s

  kafka-volume-init:
    image: redis:7.4-alpine
    user: "0:0"
    restart: "no"
    command: ["sh", "-c", "chown -R 1000:1000 /data"]
    volumes: ["kafka-data:/data"]

  kafka:
    image: apache/kafka:4.0.1
    restart: unless-stopped
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?Initialize private.env first}
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:${KAFKA_DOCKER_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes: ["kafka-data:/tmp/kraft-combined-logs"]
    ports: ["127.0.0.1:${KAFKA_DOCKER_PORT:-19092}:9094"]
    mem_limit: 1g
    depends_on:
      kafka-volume-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 20s

  redis-cache:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: ["redis-cache-data:/data"]
    ports: ["127.0.0.1:${REDIS_DOCKER_PORT:-16379}:6379"]
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  elasticsearch:
    image: elasticsearch:8.19.23
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Initialize private.env first}
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: ["elasticsearch-data:/usr/share/elasticsearch/data"]
    ports: ["127.0.0.1:${ES_DOCKER_PORT:-19200}:9200"]
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:$$ELASTIC_PASSWORD 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s' >/dev/null"]
      interval: 8s
      timeout: 5s
      retries: 40
      start_period: 30s


volumes:
  mysql-data:
  kafka-data:
  redis-cache-data:
  elasticsearch-data:
