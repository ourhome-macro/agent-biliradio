name: radio-kafka
include:
  - docker-compose.infra.yml

x-runtime-env: &runtime-env
  DATABASE_URL: ${RADIO_DOCKER_DATABASE_URL:?Prepare an isolated Docker private.env first}
  BUSINESS_DATABASE_URL: ""
  APP_DATA_DIR: /app/data
  REQUIRE_DB_MIGRATION: "1"
  APP_SECRET_KEY: ${APP_SECRET_KEY:?Initialize private.env first}
  AUTH_MODE: ${AUTH_MODE:-disabled}
  ALLOW_INSECURE_LOCAL_AUTH: ${ALLOW_INSECURE_LOCAL_AUTH:-1}
  APP_EXTERNAL_URL: ${APP_EXTERNAL_URL:-http://localhost:13000}
  APP_TRUSTED_HOSTS: ${APP_TRUSTED_HOSTS:-}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
  OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP:-}
  OIDC_BOOTSTRAP_ADMIN_ISSUER: ${OIDC_BOOTSTRAP_ADMIN_ISSUER:-}
  OIDC_BOOTSTRAP_ADMIN_SUBJECT: ${OIDC_BOOTSTRAP_ADMIN_SUBJECT:-}
  OIDC_ALLOW_HTTP: ${OIDC_ALLOW_HTTP:-false}
  JOB_TRANSPORT: kafka
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_TOPIC_PREFIX: ${KAFKA_TOPIC_PREFIX:-radio}
  KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-6}
  KAFKA_REPLICATION_FACTOR: "1"
  RABBITMQ_ENABLED: "false"
  RADIO_OUTBOX_EMBEDDED: "false"
  SSE_GATEWAY_INTERNAL_URL: ""
  FEED_ENABLED: ${FEED_ENABLED:-true}
  UGC_ENABLED: ${UGC_ENABLED:-true}
  CONTENT_SEARCH_ENABLED: ${CONTENT_SEARCH_ENABLED:-true}
  FEED_REDIS_URL: redis://redis-cache:6379/0
  SEARCH_ES_URL: http://elasticsearch:9200
  SEARCH_ES_INDEX: ${SEARCH_ES_INDEX:-radio-content-v1}
  SEARCH_ES_READ_USER: ${SEARCH_ES_READ_USER:-radio_search}
  SEARCH_ES_READ_PASSWORD: ${SEARCH_ES_READ_PASSWORD:?Initialize private.env first}
  MINIO_ENDPOINT: ${RADIO_DOCKER_MINIO_ENDPOINT:-http://host.docker.internal:19000}
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://127.0.0.1:19000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Configure the dedicated media bucket credential}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Configure the dedicated media bucket credential}
  MEDIA_BUCKET: ${MEDIA_BUCKET:-radio-media}
  MEDIA_WORKDIR: /app/media-work
  MEDIA_STORAGE_BYTES: ${MEDIA_STORAGE_BYTES:-107374182400}
  MEDIA_SCRATCH_BYTES: ${MEDIA_SCRATCH_BYTES:-10737418240}
  MEDIA_MAX_BYTES: ${MEDIA_MAX_BYTES:-2147483648}
  MEDIA_MAX_DURATION_SECONDS: ${MEDIA_MAX_DURATION_SECONDS:-3600}
  MEDIA_SIGNED_SECONDS: ${MEDIA_SIGNED_SECONDS:-7200}
  AMEM_TRANSPORT: embedded
  AMEM_ENABLED: ${AMEM_ENABLED:-true}
  AMEM_DB_PATH: /app/data/amem.sqlite3
  AUTO_DREAM_ENABLED: ${AUTO_DREAM_ENABLED:-false}
  AUTO_DREAM_LLM_ENABLED: ${AUTO_DREAM_LLM_ENABLED:-false}
  AMEM_EMBEDDING_BASE_URL: ${AMEM_EMBEDDING_BASE_URL:-}
  AMEM_EMBEDDING_MODEL: ${AMEM_EMBEDDING_MODEL:-}
  RECOMMEND_LLM_ENABLED: ${RECOMMEND_LLM_ENABLED:-false}
  RECOMMEND_DIALOGUE_LLM_ENABLED: ${RECOMMEND_DIALOGUE_LLM_ENABLED:-false}
  RECOMMEND_DIALOGUE_ROUTER_LLM_ENABLED: ${RECOMMEND_DIALOGUE_ROUTER_LLM_ENABLED:-false}
  RECOMMEND_AUTO_DISCOVERY_ENABLED: ${RECOMMEND_AUTO_DISCOVERY_ENABLED:-true}
  RECOMMEND_LLM_PROVIDER: ${RECOMMEND_LLM_PROVIDER:-deepseek}
  RECOMMEND_LLM_BASE_URL: ${RECOMMEND_LLM_BASE_URL:-https://api.deepseek.com}
  RECOMMEND_LLM_MODEL: ${RECOMMEND_LLM_MODEL:-deepseek-chat}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  TZ: Asia/Shanghai

x-runtime: &runtime
  image: radio-runtime:local
  build:
    context: ..
    dockerfile: recommend-radio/backend/Dockerfile
  restart: unless-stopped
  environment: *runtime-env
  volumes:
    - ./server-data/docker-runtime/app:/app/data
    - media-work:/app/media-work
  extra_hosts: ["host.docker.internal:host-gateway"]
  stop_grace_period: 45s
  mem_limit: 1g
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  migrate:
    <<: *runtime
    restart: "no"
    command: ["python", "docker_migrate.py"]
    environment:
      DATABASE_URL: ${RADIO_DOCKER_MIGRATION_DATABASE_URL:?Prepare an isolated Docker private.env first}
      BUSINESS_DATABASE_URL: ""
      APP_DATA_DIR: /app/data
      MYSQL_DATABASE: ${MYSQL_DATABASE:-radio_acceptance}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Initialize private.env first}
      MYSQL_APP_USER: ${MYSQL_APP_USER:-radio_app}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:?Initialize private.env first}
      MYSQL_ADMIN_USER: ${MYSQL_ADMIN_USER:-radio_admin}
      MYSQL_ADMIN_PASSWORD: ${MYSQL_ADMIN_PASSWORD:?Initialize private.env first}
    depends_on:
      mysql: {condition: service_healthy}

  kafka-init:
    <<: *runtime
    restart: "no"
    command: ["python", "-m", "kafka_worker", "--provision"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}

  search-init:
    <<: *runtime
    restart: "no"
    command: ["python", "-m", "content_search.bootstrap"]
    environment:
      SEARCH_ES_URL: http://elasticsearch:9200
      SEARCH_ES_INDEX: ${SEARCH_ES_INDEX:-radio-content-v1}
      SEARCH_ES_READ_USER: ${SEARCH_ES_READ_USER:-radio_search}
      SEARCH_ES_READ_PASSWORD: ${SEARCH_ES_READ_PASSWORD:?Initialize private.env first}
      SEARCH_ES_WRITE_USER: ${SEARCH_ES_WRITE_USER:-radio_indexer}
      SEARCH_ES_WRITE_PASSWORD: ${SEARCH_ES_WRITE_PASSWORD:?Initialize private.env first}
      SEARCH_ES_ADMIN_USER: elastic
      SEARCH_ES_ADMIN_PASSWORD: ${ELASTIC_PASSWORD:?Initialize private.env first}
    volumes: []
    depends_on:
      elasticsearch: {condition: service_healthy}

  backend:
    <<: *runtime
    command: ["python", "-m", "uvicorn", "web_asgi:app", "--host", "0.0.0.0", "--port", "5000"]
    ports: ["127.0.0.1:${PY_BACKEND_PORT:-15000}:5000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  relay:
    <<: *runtime
    command: ["python", "-m", "kafka_relay"]
    environment:
      <<: *runtime-env
      AMEM_ENABLED: "false"
    depends_on:
      kafka-init: {condition: service_completed_successfully}

  jobs-events:
    <<: *runtime
    command: ["python", "-m", "kafka_worker", "--lanes", "jobs,events", "--concurrency", "2"]
    depends_on:
      kafka-init: {condition: service_completed_successfully}

  media-worker:
    <<: *runtime
    command: ["python", "-m", "kafka_worker", "--lanes", "media", "--concurrency", "2"]
    environment:
      <<: *runtime-env
      AMEM_ENABLED: "false"
    depends_on:
      kafka-init: {condition: service_completed_successfully}

  search-worker:
    <<: *runtime
    command: ["python", "-m", "content_search.worker"]
    environment:
      <<: *runtime-env
      AMEM_ENABLED: "false"
      SEARCH_ES_WRITE_USER: ${SEARCH_ES_WRITE_USER:-radio_indexer}
      SEARCH_ES_WRITE_PASSWORD: ${SEARCH_ES_WRITE_PASSWORD:?Initialize private.env first}
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      search-init: {condition: service_completed_successfully}

  cache-invalidator:
    <<: *runtime
    command: ["python", "-m", "content_search.cache_worker"]
    environment:
      <<: *runtime-env
      AMEM_ENABLED: "false"
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      redis-cache: {condition: service_healthy}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:5000
      SSE_GATEWAY_URL: http://backend:5000
      STATIC_ROOT: /app/dist
      PORT: "3000"
    ports: ["127.0.0.1:${FRONTEND_PORT:-13000}:3000"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 15
    mem_limit: 256m

volumes:
  media-work:
