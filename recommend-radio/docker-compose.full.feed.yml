# Optional feature override on top of docker-compose.full.yml.
services:
  backend:
    environment: &feed-flags
      FEED_ENABLED: ${FEED_ENABLED:-true}
      UGC_ENABLED: ${UGC_ENABLED:-true}
      CONTENT_SEARCH_ENABLED: ${CONTENT_SEARCH_ENABLED:-true}
  jobs-events:
    environment: *feed-flags
  media-worker:
    environment: *feed-flags
