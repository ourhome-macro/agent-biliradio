# Overlay with docker-compose.full.yml; all infrastructure ports remain loopback-only.
services:
  backend:
    ports: !reset []
    environment:
      AUTH_MODE: oidc
      ALLOW_INSECURE_LOCAL_AUTH: "0"
      APP_EXTERNAL_URL: https://${APP_DOMAIN:?Set APP_DOMAIN}
      APP_TRUSTED_HOSTS: ${APP_DOMAIN:?Set APP_DOMAIN}
      SESSION_COOKIE_SECURE: "true"
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?Set the public HTTPS media origin}
  frontend:
    ports: !reset []
    expose: ["3000"]
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs: ["/tmp:size=32m"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      frontend: {condition: service_healthy}
volumes:
  caddy-data:
  caddy-config:
