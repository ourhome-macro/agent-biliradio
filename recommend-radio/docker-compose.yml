services:
  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine
    container_name: bilibili-radio-rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-radio}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-radio_dev_password}"
      RABBITMQ_DEFAULT_VHOST: "${RABBITMQ_VHOST:-/}"
      TZ: Asia/Shanghai
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          rabbitmq-diagnostics -q ping &&
          rabbitmq-diagnostics -q check_running &&
          rabbitmq-diagnostics -q check_local_alarms
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  rabbitmq-data:
