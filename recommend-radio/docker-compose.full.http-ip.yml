services:
  backend:
    environment:
      AUTH_MODE: disabled
      ALLOW_INSECURE_LOCAL_AUTH: ${ALLOW_INSECURE_LOCAL_AUTH:?Set ALLOW_INSECURE_LOCAL_AUTH=1 only behind firewall or VPN}
      SESSION_COOKIE_SECURE: "false"
      APP_SESSION_COOKIE_NAME: ${APP_SESSION_COOKIE_NAME:-br_session}
      APP_EXTERNAL_URL: ${APP_EXTERNAL_URL:-}
      APP_TRUSTED_HOSTS: ${APP_TRUSTED_HOSTS:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
