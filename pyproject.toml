[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-memory-runtime"
version = "0.6.0"
description = "Durable business-agent orchestration and proposal-first audited memory runtime."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Agent Memory Runtime Contributors" }]
dependencies = [
  "openai>=1.0",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "rich>=13.7",
  "PyYAML>=6.0",
  "jsonschema[format-nongpl]>=4.23",
  "sqlite-vec==0.1.9",
  "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1",
  "alembic==1.20.0",
  "filelock>=3.16,<4",
  "opentelemetry-sdk==1.44.0",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "ruff==0.15.14",
  "pre-commit==4.7.0",
  "tiktoken>=0.8",
  "fakeredis[lua]>=2.32,<3",
  "playwright>=1.50,<2",
]
qdrant = [
  "qdrant-client>=1.9",
]
langchain = [
  "langchain-core>=0.2",
]
platform = [
  "qdrant-client>=1.9",
  "langchain-core>=0.2",
]

[project.scripts]
amem = "agent_memory_runtime.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_memory_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: requires isolated MySQL/Kafka/Elasticsearch or legacy RabbitMQ services",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
