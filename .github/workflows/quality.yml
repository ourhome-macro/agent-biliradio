name: Quality

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install ruff==0.15.14 PyYAML==6.0.3
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python scripts/quality.py lint
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/quality.yml

  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            recommend-radio/backend/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y redis-server ffmpeg
      - run: python -m pip install -e '.[dev]' -r recommend-radio/backend/requirements.txt
      - run: python scripts/quality.py test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-results
          path: artifacts/quality/*.xml
          if-no-files-found: error
          retention-days: 14

  golden:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            recommend-radio/backend/requirements.txt
      - run: python -m pip install -e '.[dev]' -r recommend-radio/backend/requirements.txt
      - run: python scripts/quality.py golden
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-results
          path: artifacts/quality/golden.json
          if-no-files-found: error
          retention-days: 14

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: recommend-radio/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: recommend-radio/frontend
      - run: python scripts/quality.py frontend

  integration:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Disposable runner-local service credentials; never production secrets.
      RADIO_TEST_MYSQL_ADMIN_URL: mysql+pymysql://root:ci-only-password@127.0.0.1:13307/
      RADIO_TEST_RABBITMQ_URL: amqp://radio:ci-only-password@127.0.0.1:15672/
      RADIO_TEST_ES_URL: http://127.0.0.1:19200
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: '%'
        ports: ['13307:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=5s --health-timeout=5s --health-retries=30
      kafka:
        image: apache/kafka:4.0.1
        env:
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
          KAFKA_NODE_ID: '1'
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:19092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
          KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
        ports: ['19092:9094']
        options: >-
          --health-cmd="/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval=10s --health-timeout=10s --health-retries=30
      redis:
        image: redis:7.4
        ports: ['16379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
      elasticsearch:
        image: elasticsearch:8.19.23
        env:
          discovery.type: single-node
          xpack.security.enabled: 'true'
          xpack.security.http.ssl.enabled: 'false'
          ELASTIC_PASSWORD: ci-only-es-password
          ES_JAVA_OPTS: -Xms256m -Xmx512m
        ports: ['19200:9200']
        options: >-
          --health-cmd="curl -fs -u elastic:ci-only-es-password http://localhost:9200/_cluster/health"
          --health-interval=10s --health-timeout=5s --health-retries=30
      rabbitmq:
        image: rabbitmq:4.3
        env:
          RABBITMQ_DEFAULT_USER: radio
          RABBITMQ_DEFAULT_PASS: ci-only-password
        ports: ['15672:5672']
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            recommend-radio/backend/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y redis-server ffmpeg
      - run: python -m pip install -e '.[dev]' -r recommend-radio/backend/requirements.txt
      - name: Configure disposable acceptance services
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          target = Path(os.environ['RUNNER_TEMP']) / 'radio-integration.env'
          target.write_text('\n'.join([
              'KAFKA_TEST_ROOT_DATABASE_URL=' + os.environ['RADIO_TEST_MYSQL_ADMIN_URL'],
              'KAFKA_TEST_BOOTSTRAP_SERVERS=127.0.0.1:19092',
              'KAFKA_TEST_REDIS_URL=redis://127.0.0.1:16379/0',
              'SEARCH_ES_ADMIN_USER=elastic',
              'SEARCH_ES_ADMIN_PASSWORD=ci-only-es-password',
          ]) + '\n', encoding='utf-8')
          target.chmod(0o600)
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as output:
              print('RADIO_TEST_ENV_FILE=' + str(target), file=output)
          PY
      - run: python scripts/quality.py integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: |
            artifacts/quality/main.xml
            artifacts/quality/search-live.json
          if-no-files-found: error
          retention-days: 14

  quality-gate:
    if: always()
    needs: [lint, contracts, golden, frontend, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      LINT: ${{ needs.lint.result }}
      CONTRACTS: ${{ needs.contracts.result }}
      GOLDEN: ${{ needs.golden.result }}
      FRONTEND: ${{ needs.frontend.result }}
      INTEGRATION: ${{ needs.integration.result }}
      REQUIRE_INTEGRATION: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Require all expected checks
        run: |
          python3 - <<'PY'
          import os
          checks = ['LINT', 'CONTRACTS', 'GOLDEN', 'FRONTEND']
          if os.environ['REQUIRE_INTEGRATION'] == 'true':
              checks.append('INTEGRATION')
          failed = [key for key in checks if os.environ[key] != 'success']
          if failed:
              raise SystemExit('Required checks did not succeed: ' + ', '.join(failed))
          PY
